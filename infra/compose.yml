services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: veiller
      POSTGRES_USER: veiller
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veiller -d veiller"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ${CR_URL}/veiller/api:latest
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Firebase__ProjectId: ${FIREBASE_PROJECT_ID}
      Firebase__WebApiKey: ${FIREBASE_WEB_API_KEY}
      ConnectionStrings__Veiller: Host=postgres;Database=veiller;Username=veiller;Password=${POSTGRES_PASSWORD}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-sa.json
    volumes:
      - ./firebase-sa.json:/run/secrets/firebase-sa.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:latest
    restart: unless-stopped
    env_file:
      - ".env"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
