services:
  api:
    image: ${CR_URL}/veiller/api:latest
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Firebase__ProjectId: ${FIREBASE_PROJECT_ID}
      Firebase__WebApiKey: ${FIREBASE_WEB_API_KEY}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-sa.json
    volumes:
      - ./firebase-sa.json:/run/secrets/firebase-sa.json:ro
    restart: unless-stopped

  caddy:
    image: caddy:latest
    restart: unless-stopped
    env_file:
      - ".env"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
